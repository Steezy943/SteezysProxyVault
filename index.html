<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steezy's Proxy Vault</title>
    <!-- Linking external modular assets -->
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <!-- 1. Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- 2. Animated Entry Splash Screen -->
    <div id="splash-screen">
        <img id="splash-logo" src="SiteLogo.png" alt="Steezy's Vault Logo">
    </div>
    
    <!-- 3. Composition Breakdown Breakdown Modal -->
    <div class="modal-mask" id="metrics-modal" onclick="closeMetricsModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">Vault Composition</h3>
                <button class="modal-close-btn" onclick="closeMetricsModal()">✕</button>
            </div>
            <div class="metrics-grid" id="metrics-grid-target"></div>
        </div>
    </div>

    <!-- 4. Live Proxy Inspector Details Card Popup -->
    <div class="modal-mask" id="profile-modal" onclick="closeProfileModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header" style="margin-bottom: 1rem;">
                <h3 class="modal-title">Proxy Information</h3>
                <button class="modal-close-btn" onclick="closeProfileModal()">✕</button>
            </div>
            <div class="profile-sub" id="prof-url-text">https://target-domain.org</div>
            
            <div class="profile-label">Host Architecture Type</div>
            <div class="profile-value-box"><span id="prof-arch-type">Loading...</span></div>

            <div class="profile-label">Assigned Core Tag</div>
            <div class="profile-value-box"><span id="prof-tag-name">Loading...</span></div>
            
            <div class="profile-label">Encryption Profile</div>
            <div class="profile-value-box" style="margin-bottom:0;">
                <span>XHR-Bypass Handshake v2</span>
                <span style="font-size:0.75rem; color:#10b981; font-weight:bold;">Active</span>
            </div>
        </div>
    </div>

    <!-- 5. Custom Advanced Filter Popup Modal Container -->
    <div class="modal-mask" id="filter-modal" onclick="closeFilterModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">Filter Engine</h3>
                <button class="modal-close-btn" onclick="closeFilterModal()">✕</button>
            </div>
            
            <div class="filter-nav-bar">
                <button class="filter-tab-btn active" id="btn-tab-cat" onclick="switchFilterTab('cat')">Category Tag</button>
                <button class="filter-tab-btn" id="btn-tab-block" onclick="switchFilterTab('block')">School Blocker Engine</button>
            </div>

            <div class="filter-view-pane active" id="pane-filter-cat">
                <div class="filter-grid" id="filter-checkbox-target"></div>
            </div>
            
            <div class="filter-view-pane" id="pane-filter-block">
                <div class="frosted-blur-pane">
                    <div class="cs-tag">Coming Soon</div>
                </div>
            </div>
            
            <div class="filter-footer-actions">
                <button class="action-btn" style="background:transparent; border-color:transparent; color:#71717a;" onclick="resetFiltersAction()">Reset All</button>
                <button class="action-btn" onclick="closeFilterModal()">Apply Parameters</button>
            </div>
        </div>
    </div>

    <!-- 6. Main Dashboard Interface Content Canvas -->
    <div id="main-content">
        <header>
            <div class="site-title">Steezy's Vault</div>
        </header>
        <div id="vault-view" class="app-view active">
            <div class="control-row">
                <div class="view-title-group">
                    <h2 class="view-title">Network Index</h2>
                    <div class="total-counter-text" id="global-total-counter" onclick="openMetricsModal()">Loading metrics...</div>
                </div>
                <div class="dropdown-container">
                    <button class="dropdown-trigger" onclick="openFilterModal(event)">
                        <span>Filter Categories</span> <span style="font-size:0.6rem; opacity:0.5;">▼</span>
                    </button>
                </div>
            </div>
            <div class="vault-display">
                <ul class="proxy-list" id="proxy-list-target"></ul>
            </div>
        </div>
    </div>
</body>
</html>
