<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steezy's Proxy Vault</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-logo {
            max-width: 300px;
            width: 80%;
            opacity: 0;
            transform: scale(0.9);
            animation: logoSequence 1.8s forwards ease-in-out;
        }
        @keyframes logoSequence {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            30% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 0;
                transform: scale(0.95);
            }
        }
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid #111111;
            margin-bottom: 3rem;
        }
        .site-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
        }
        .user-tag {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaaaaa;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
        }
        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 280px 1fr;
            }
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .cat-tab {
            background: #09090b;
            border: 1px solid #1c1c1e;
            color: #8a8a93;
            padding: 1rem;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .cat-tab:hover {
            background: #121214;
            color: #ffffff;
            border-color: #2c2c2e;
        }
        .cat-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .vault-display {
            background-color: #050505;
            border: 1px solid #111111;
            border-radius: 12px;
            padding: 2rem;
        }
        .vault-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #111111;
        }
        .vault-title {
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .proxy-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .proxy-card {
            background: #09090b;
            border: 1px solid #161618;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s ease;
        }
        .proxy-card:hover {
            border-color: #2c2c2e;
        }
        .proxy-url {
            color: #e4e4e7;
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-all;
            padding-right: 1rem;
        }
        .proxy-url:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .action-btn {
            background: #161618;
            border: 1px solid #2c2c2e;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <img id="splash-logo" src="SiteLogo.png" alt="Steezy's Proxy Vault Logo">
    </div>
    <div id="main-content">
        <header>
            <div class="site-title">Steezy's Vault</div>
            <div class="user-tag">• Guest_User</div>
        </header>
        <div class="dashboard-grid">
            <div class="sidebar" id="category-tabs"></div>
            <div class="vault-display">
                <div class="vault-header">
                    <h2 class="vault-title" id="current-category-name">Loading Vault...</h2>
                </div>
                <ul class="proxy-list" id="proxy-list-target"></ul>
            </div>
        </div>
    </div>
    <script>
        const categories = ["Fern", "Cherri"];
        let proxyDataStore = {};

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const mainContent = document.getElementById('main-content');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    mainContent.style.display = 'block';
                    setTimeout(() => {
                        mainContent.style.opacity = '1';
                    }, 50);
                }, 500);
            }, 1800);
            initVault();
        });

        async function initVault() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';
            for (let i = 0; i < categories.length; i++) {
                const cat = categories[i];
                try {
                    const response = await fetch(`categories/${cat}.txt`);
                    if (response.ok) {
                        const rawText = await response.text();
                        proxyDataStore[cat] = rawText.split('\n')
                                                     .map(line => line.trim())
                                                     .filter(line => line.length > 0);
                    } else {
                        proxyDataStore[cat] = [];
                    }
                } catch (e) {
                    proxyDataStore[cat] = [];
                }
                const button = document.createElement('button');
                button.className = `cat-tab ${i === 0 ? 'active' : ''}`;
                button.textContent = cat;
                button.onclick = () => switchCategory(cat, button);
                tabsContainer.appendChild(button);
            }
            if (categories.length > 0) {
                renderCategoryLinks(categories[0]);
            }
        }

        function switchCategory(categoryName, element) {
            document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderCategoryLinks(categoryName);
        }

        function renderCategoryLinks(categoryName) {
            document.getElementById('current-category-name').textContent = `${categoryName} Proxies`;
            const listTarget = document.getElementById('proxy-list-target');
            listTarget.innerHTML = '';
            const links = proxyDataStore[categoryName] || [];
            if (links.length === 0) {
                listTarget.innerHTML = `<li style="color: #555555; font-size: 0.9rem;">No active nodes found.</li>`;
                return;
            }
            links.forEach(url => {
                const li = document.createElement('li');
                li.className = 'proxy-card';
                li.innerHTML = `<a class="proxy-url" href="${url}" target="_blank">${url}</a><button class="action-btn" onclick="copyToClipboard('${url}', this)">Copy</button>`;
                listTarget.appendChild(li);
            });
        }

        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = element.textContent;
                element.textContent = 'Copied!';
                element.style.background = '#ffffff';
                element.style.color = '#000000';
                setTimeout(() => {
                    element.textContent = originalText;
                    element.style.background = '';
                    element.style.color = '';
                }, 1000);
            });
        }
    </script>
</body>
</html>
